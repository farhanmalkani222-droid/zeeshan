<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hawa Taps reply helper</title><style>
:root{--bg:#f4f4f6;--card:#fff;--txt:#1c1c1e;--mut:#6b6b70;--acc:#3b6cf6;--line:#dcdce2}
@media(prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1e;--txt:#eee;--mut:#9a9aa0;--line:#333}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mut);margin-bottom:14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--txt);resize:vertical}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.reply{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;white-space:pre-wrap;background:var(--bg)}
.tag{font-size:12px;color:var(--mut);margin-top:10px}
</style></head><body><main>
<h1>Hawa Taps reply helper</h1>
<div class="sub">Paste the customer's message, tap Find reply, then Copy and paste it into the Instagram chat. Works offline. Nothing is sent or stored.</div>
<div class="card"><textarea id="in" placeholder="Customer ka message yahan paste karein..."></textarea>
<div class="row"><button onclick="find()">Find reply</button><button class="alt" onclick="clr()">Clear</button></div></div>
<div id="out"></div>
<div class="card"><b>Quick replies</b><div class="row" id="quick"></div></div>
<script>
const D={"entries": [{"id": "price", "keywords": ["price", "kitne ka", "rate", "cost", "kimat", "keemat", "how much"], "answer": "Hamare taps ₹300 per tap hain. Kitne chahiye? Bata dein toh order note kar leta hoon."}, {"id": "product", "keywords": ["details", "detail", "product", "tap kaisa", "kaisa tap"], "answer": "Ye premium quality ke taps hain, long-lasting finish ke saath. Aap kaunsa use (kitchen/bathroom) dekh rahe hain?"}, {"id": "origin", "keywords": ["kahan se", "factory", "kaha ka", "made in", "origin", "kaun si company", "manufacture"], "answer": "Hamara maal Taloja MIDC factory area se aata hai. Courier se All India delivery hoti hai."}, {"id": "delivery", "keywords": ["delivery", "deliver", "kitne din", "shipping", "kab tak", "courier", "ship"], "answer": "Delivery courier se All India hoti hai, jahan aapko chahiye wahan pahunch jaata hai. Maal Taloja MIDC factory area se bheja jaata hai. Apna pincode bhej dein, delivery time confirm kar deta hoon."}, {"id": "cod", "keywords": ["cod", "cash on delivery", "payment", "upi", "advance", "pay"], "answer": "Payment UPI se ho jaata hai. COD ke liye bata dein, hum check karke confirm karte hain."}, {"id": "warranty", "keywords": ["warranty", "guarantee", "return", "replace", "exchange", "kharab", "toot gaya", "repair"], "answer": "1 saal ki warranty hai. Nal kharab ho jaaye toh Ahmed bhai ko bhej dein, badle mein naya nal free of cost milega inshallah."}, {"id": "amazon", "keywords": ["amazon", "online", "compare", "comparison", "market rate", "market mein", "saste", "mehenga", "mahanga"], "answer": "Isse chhote models Amazon pe ₹350–400 mein bikte hain. Hamare yahan ye wale ₹300 mein milte hain — bade, mazboot, ABS body aur aluminium button ke saath."}, {"id": "saving", "keywords": ["paani bachao", "water saving", "save water", "bachat", "kitna paani bachega", "water waste", "environment"], "answer": "Ye taps 70–80% paani bachate hain. Ek nal se roz kam-se-kam 60 litre paani ki bachat hoti hai. All India 50,000+ masjids, 30,000+ madarse, aur 1,000+ schools/hospitals mein use ho raha hai."}, {"id": "order", "keywords": ["order", "book", "buy", "lena hai", "chahiye", "kaise le"], "answer": "Bahut badhiya! Kitne taps chahiye, apna naam, pura address aur pincode bhej dein. Courier se aapke paas bhej denge."}, {"id": "size", "keywords": ["size", "kitna size", "naal ka size", "inch", "kitne inch", "naap"], "answer": "Naal half inch size ka hai."}, {"id": "material", "keywords": ["material", "kis cheez ka", "kaunsa material", "body kis", "plastic", "abs", "button ka material", "banawat"], "answer": "Body ABS material ki hai, jo saade plastic se 10 guna zyada mazboot hai. Humne 70kg ka aadmi naal pe khada kar diya, tab bhi naal nahi toota. Button aluminium ka hai. Alhamdulillah quality mein koi problem nahi aayegi."}, {"id": "strength", "keywords": ["mazboot", "majboot", "strong", "tootega", "tough", "durable", "load", "weight", "kitna weight"], "answer": "Bahut mazboot hai — humne 70kg ka aadmi naal pe khada kar diya tab bhi nahi toota. Body ABS (saade plastic se 10x mazboot) aur button aluminium ka hai."}, {"id": "greeting", "keywords": ["hi", "hello", "hey", "salam", "assalam", "namaste", "hii"], "answer": "Hello! Hawa Taps mein aapka swagat hai. Kaunsa product ya kya jaanna chahte hain?"}], "intro_salam": ["Walaikum-assalam! Hawa Taps mein aapka swagat hai. Ek nal ki keemat ₹300 hai. Courier ke zariye All India delivery ho jaati hai, jahan chahiye wahan.", "Hamara head office Nagpada, Mumbai mein hai, factory Taloja, Mumbai mein hai. Maal courier ke zariye aap tak aa jaayega.", "Nal pe 1 saal warranty. Uske baad bhi kuch hua toh kharab nal Ahmad bhai tak bhej dena, badle mein naya nal free of cost mil jayega inshallah.", "Nal ABS material ka bana hai — saade plastic se 10 guna zyada mazboot, aur button aluminium ka hai, toh tootne ki koi shikayat nahi. Isse chhote models hamare Amazon pe ₹350 aur ₹400 mein bikte hain, ye wale ki keemat ₹300 per nal hai."], "intro_walaikum": ["Assalam-o-alaikum! Hawa Taps mein aapka swagat hai. Ek nal ki keemat ₹300 hai. Courier ke zariye All India delivery ho jaati hai, jahan chahiye wahan.", "Hamara head office Nagpada, Mumbai mein hai, factory Taloja, Mumbai mein hai. Maal courier ke zariye aap tak aa jaayega.", "Nal pe 1 saal warranty. Uske baad bhi kuch hua toh kharab nal Ahmad bhai tak bhej dena, badle mein naya nal free of cost mil jayega inshallah.", "Nal ABS material ka bana hai — saade plastic se 10 guna zyada mazboot, aur button aluminium ka hai, toh tootne ki koi shikayat nahi. Isse chhote models hamare Amazon pe ₹350 aur ₹400 mein bikte hain, ye wale ki keemat ₹300 per nal hai."], "greet_salam": "Walaikum-assalam! Hawa Taps mein aapka swagat hai. Nal ke baare mein aapko kya jaanna hai?", "greet_walaikum": "Assalam-o-alaikum! Hawa Taps mein aapka swagat hai. Nal ke baare mein aapko kya jaanna hai?", "fallback": "Thoda detail bata dein, Ahmed bhai isko confirm karke jaldi reply karenge.", "shop": "Hawa Taps"};
const norm=t=>" "+t.toLowerCase().replace(/[^\p{L}\p{N}_\s₹]/gu," ")+" ";
const score=(t,e)=>e.keywords.filter(k=>norm(t).includes(norm(k))).length;
const isWal=t=>/\b(wa[\W_]?alai?kum|walaikum|walekum|walikum)/i.test(t);
const isSalam=t=>/\bassalam|salaam|salam[\W_]?ale?ku?m|salam\b/i.test(t);
const GREET=/^\s*(hi+|hello+|hey+|namaste|salaam|salam|assalam[\w\s\-o]*|walaikum[\w\s]*assalam|walaikum|walekum)\s*[?.! ]*\s*$/i;
const INTRO=/^\s*(details?|info|information|inquiry|enquiry|moq|minimum order|tap ke baare mein|nal ke baare mein)\s*[?.! ]*\s*$/i;
function replies(text){
  const wal=isWal(text), sal=isSalam(text);
  if(GREET.test(text)) return [{tag:"Greeting",msgs:[sal&&!wal?D.greet_salam:D.greet_walaikum]}];
  if(INTRO.test(text)) return [{tag:"Full intro (send in this order)",msgs:(sal&&!wal)?D.intro_salam:D.intro_walaikum}];
  const r=D.entries.map(e=>({e,s:score(text,e)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3);
  if(!r.length) return [{tag:"No match: safe reply",msgs:[D.fallback]}];
  return r.map((x,i)=>({tag:(i?"Other possible: ":"Best match: ")+x.e.id,msgs:[x.e.answer]}));
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function card(g){return '<div class="card"><div class="tag">'+esc(g.tag)+'</div>'+g.msgs.map(m=>'<div class="reply">'+esc(m)+'</div><div class="row"><button data-m="'+encodeURIComponent(m)+'" onclick="cp(this)">Copy</button></div>').join("")+'</div>'}
function find(){const t=document.getElementById("in").value.trim();if(!t)return;document.getElementById("out").innerHTML=replies(t).map(card).join("")}
function clr(){document.getElementById("in").value="";document.getElementById("out").innerHTML=""}
async function cp(b){const m=decodeURIComponent(b.dataset.m);try{await navigator.clipboard.writeText(m)}catch(e){const t=document.createElement("textarea");t.value=m;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}const o=b.textContent;b.textContent="Copied";setTimeout(()=>b.textContent=o,1200)}
document.getElementById("quick").innerHTML=D.entries.map(e=>'<button class="alt" onclick="show(\''+e.id+'\')">'+e.id+'</button>').join("");
function show(id){const e=D.entries.find(x=>x.id===id);document.getElementById("out").innerHTML=card({tag:e.id,msgs:[e.answer]})}
document.getElementById("in").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))find()});
</script></main></body></html>
